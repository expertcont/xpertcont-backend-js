# Build de Railway (Nixpacks) para el backend.
# Ademas de npm install, baja el navegador Chromium que Playwright usa para
# el login portal SUNAT (obtencion del token CPE cuando la app de la empresa
# no declara el recurso /v1/contribuyente/consultacpe).
# SUNAT corta la conexion del Chrome headless (ERR_CONNECTION_RESET): el
# navegador debe correr REAL, con una pantalla virtual X (xvfb). xvfb entra
# por apt-get (el mismo canal de sistema que usa "playwright install
# --with-deps"); el Start Command corre bajo xvfb-run -a.
[phases.install]
cmds = [
  "apt-get update && apt-get install -y xvfb",
  "npm install",
  "npx playwright install --with-deps chromium",
]

[start]
cmd = "xvfb-run -a npm start"
